name: CI ergonomics

# What a project's CI gets from Runtests, checked end to end in one job. It runs a fake
# suite, test/testfixtures/FakeCI.jl, whose items fail in every way the README describes,
# with the README's recipe for CI: `julia-runtest`, the run-state cache, and
# `RUNTESTS_ARTIFACT_DIR` uploaded as an artifact. Then it starts over from what it
# saved, as the next job or a person would: the artifact downloaded and the cache
# restored, and checks the run state, the logs, each failed attempt's evidence, the
# cache, and the failing items run again from the download.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  FAKECI: test/testfixtures/FakeCI.jl

jobs:
  fake-ci:
    name: Fake CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      # Every cache step names the same path: a cache is found by its key and by its paths,
      # and a restore that names other paths misses it. The run states are named rather
      # than their directory less the logs: the cache archives a directory it is given
      # whole, whatever an exclusion says.
      - name: Restore the run states of earlier runs
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/runtests/*.runstate
          key: fakeci-runstates-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: fakeci-runstates-
      - name: Run the fake suite, whose tests fail on purpose
        id: suite
        uses: julia-actions/julia-runtest@v1
        # Its failure is checked by the next step, and what it left by the last.
        continue-on-error: true
        with:
          project: ${{ env.FAKECI }}
          coverage: false
        env:
          RUNTESTS_RUNSTATE_DIR: ${{ runner.temp }}/runtests
          RUNTESTS_HOST: ci-fakeci
          RUNTESTS_ARTIFACT_DIR: ${{ runner.temp }}/runtests-artifact
      - name: Check that the suite failed
        if: steps.suite.outcome != 'failure'
        run: |
          echo "::error::the fake suite's tests ended with '${{ steps.suite.outcome }}'; they fail on purpose, so this has to be 'failure'"
          exit 1
      - name: Save the run states for the next run, without their logs
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/runtests/*.runstate
          key: fakeci-runstates-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload this run's run state, logs and evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: fakeci
          path: ${{ runner.temp }}/runtests-artifact
          if-no-files-found: error
      # From here on, only what was saved: what the next job, or a person, gets.
      - name: Start over from what was saved
        if: ${{ !cancelled() }}
        run: rm -rf "${{ runner.temp }}/runtests" "${{ runner.temp }}/runtests-artifact"
      - name: Download what the run uploaded
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@v4
        with:
          name: fakeci
          path: ${{ runner.temp }}/downloaded
      - name: Restore the run states the run saved
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/runtests/*.runstate
          key: fakeci-runstates-${{ github.run_id }}-${{ github.run_attempt }}
          fail-on-cache-miss: true
      - name: Instantiate the fake suite's test environment
        if: ${{ !cancelled() }}
        run: julia --color=yes --project=${{ env.FAKECI }}/test -e "using Pkg; Pkg.instantiate()"
      - name: Check what the run left
        if: ${{ !cancelled() }}
        run: julia --color=yes --project=${{ env.FAKECI }}/test .github/scripts/verify_fake_run.jl
        env:
          FAKECI_ARTIFACT: ${{ runner.temp }}/downloaded
          FAKECI_RUNSTATES: ${{ runner.temp }}/runtests
