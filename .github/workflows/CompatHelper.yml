name: CompatHelper

on:
  schedule:
    - cron: 0 0 * * *
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  CompatHelper:
    runs-on: ubuntu-latest
    steps:
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - name: Add the General registry via Git
        run: |
          import Pkg
          ENV["JULIA_PKG_SERVER"] = ""
          Pkg.Registry.add("General")
        shell: julia --color=yes {0}
      - name: Install CompatHelper
        run: |
          import Pkg
          Pkg.add(; name = "CompatHelper", uuid = "aa819f21-2bde-4658-8897-bab36330d9b7", version = "3")
        shell: julia --color=yes {0}
      - name: Run CompatHelper
        # Every project here with a [compat] of its own: Runtests, its test
        # environment, and RuntestsWorkers.
        run: |
          import CompatHelper
          CompatHelper.main(; subdirs = ["", "test", "lib/RuntestsWorkers"])
        shell: julia --color=yes {0}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pull requests opened with GITHUB_TOKEN start no CI; with a deploy key they do.
          COMPATHELPER_PRIV: ${{ secrets.DOCUMENTER_KEY }}
